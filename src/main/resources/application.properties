server.port=${PORT:8080}
logging.level.org.atmosphere = warn
spring.mustache.check-template-location = false

# Launch the default browser when starting the application in development mode
vaadin.launch-browser=true
# To improve the performance during development.
# For more information https://vaadin.com/docs/flow/spring/tutorial-spring-configuration.html#special-configuration-parameters
vaadin.whitelisted-packages = com.vaadin,org.vaadin,dev.hilla,com.example.application
spring.jpa.defer-datasource-initialization = true

#vaadin.url-mapping=/vaadin-app/*
#vaadin.sso.logout-redirect-route={baseUrl}/vaadin-app

#---- 
# docker compose exposes 8081 to the KC cotainer, 
# inside the dev container postStart redirects localhost:8081 to sso-kit-demo-keycloak:8080 
# which is the hostname defined in docker-compose.yml
spring.security.oauth2.client.provider.keycloak.issuer-uri=http://localhost:8081/realms/vaadin-sso
spring.security.oauth2.client.registration.keycloak.client-id=vaadin-sso
# For demo purposes only, never hardcode client secrets!!! Github will ikely flag this... as it should, YOU should not do this use variables!
spring.security.oauth2.client.registration.keycloak.client-secret=HYEiArDPFoWF5lf78Xd9cLYbdWRYFpJs
spring.security.oauth2.client.registration.keycloak.scope=profile,openid,email,roles

vaadin.sso.login-route=/oauth2/authorization/keycloak
