name: Maven Build and Run Tests 

on:
  push:
    branches: 
      - main
  pull_request:
    branches: 
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
#    - name: Build with Maven
#      env:
#         VAADIN_OFFLINE_KEY: ${{ secrets.VAADIN_PRODMODE_CI_SERVER_KEY }}
#      run: mvn -B clean package -Pproduction --file pom.xml -DskipTests
      
    - name: Prepare Keycloak data directory permissions for GH Actions
      run: |
        mkdir -p docker/keycloak_data
        chmod -R 777 docker/keycloak_data

    - name: Start Docker Compose services (Keycloak)
      run: docker compose up -d

    - name: Wait for Keycloak to be ready
      run: |
        echo "Waiting for Keycloak health endpoint to be available..."
        for i in {1..60}; do
          if curl --head -fsS http://localhost:9000/health/ready > /dev/null 2>&1; then
            echo "Keycloak health endpoint is responding!"
            break
          fi
          echo "Attempt $i: Health endpoint not ready yet, waiting 5 seconds..."
          sleep 5
        done
        
        # Verify health endpoint is working
        if ! curl --head -fsS http://localhost:9000/health/ready > /dev/null 2>&1; then
          echo "Keycloak health endpoint failed to become available within 5 minutes"
          echo "Container status:"
          docker ps -a
          echo "Keycloak logs:"
          docker logs sso-kit-demo-keycloak
          exit 1
        fi

    - name: Check running Compose services
      run: docker ps -a | tee docker_ps_output.txt

    - name: Log Keycloak services after startup
      run: docker logs sso-kit-demo-keycloak | tee docker_logs_output.txt

    - name: Run tests
      env:
         VAADIN_OFFLINE_KEY: ${{ secrets.VAADIN_PRODMODE_CI_SERVER_KEY }}
      run: mvn -B verify -Pproduction,it --file pom.xml -Dcom.vaadin.testbench.Parameters.chromeOptions="--headless --disable-gpu"

    - name: Stop Docker Compose services
      if: always()
      run: docker compose down